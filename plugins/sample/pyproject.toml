[project]
name = "tri-al-sample"
version = "0.1.0"
description = "Sample Tri-AL plugin that shows how discovery, settings and CLI registration work."
requires-python = ">=3.13"
dependencies = ["tri-al"]

[project.entry-points."tri_al.plugins"]
sample = "tri_al_sample:plugin"

[tool.uv.sources]
tri-al = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "tri-al-insights"
version = "0.1.0"
description = "Research Intelligence for Tri-AL: trends and semantic trial clusters."
requires-python = ">=3.13"
dependencies = ["scikit-learn>=1.3", "tri-al", "umap-learn>=0.5.12"]

[project.entry-points."tri_al.plugins"]
insights = "tri_al_insights:plugin"

[tool.uv.sources]
tri-al = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

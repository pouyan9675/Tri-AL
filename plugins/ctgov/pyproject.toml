[project]
name = "trial-al-ctgov"
version = "0.1.0"
description = "ClinicalTrials.gov source for Tri-AL: bulk install and daily updates from API v2."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "orjson>=3.13.0",
    "trial-al",
]

[project.entry-points."trial_al.plugins"]
ctgov = "trial_al_ctgov:plugin"

[tool.uv.sources]
trial-al = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

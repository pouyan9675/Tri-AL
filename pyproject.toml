# Workspace root for Tri-AL v2 (see docs/design.md §4). v1's Django code at the
# repository root is not part of the workspace and is excluded from every tool below.

[tool.uv.workspace]
members = ["core", "plugins/*"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
tri-al = { workspace = true }
tri-al-sample = { workspace = true }
tri-al-ctgov = { workspace = true }
tri-al-charts = { workspace = true }
tri-al-insights = { workspace = true }
tri-al-results = { workspace = true }

[dependency-groups]
dev = [
    "tri-al",
    "tri-al-sample",
    "tri-al-ctgov",
    "tri-al-charts",
    "tri-al-insights",
    "tri-al-results",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
    "httpx>=0.28.1",
    "httpx2>=2.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "tri_al",
    "tri_al_sample",
    "tri_al_ctgov",
    "tri_al_charts",
    "tri_al_insights",
    "tri_al_results",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["core/src", "core/tests", "plugins/*/src", "plugins/*/tests", "bench"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "plugins"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: talks to the real ClinicalTrials.gov API; run with `uv run pytest -m live`"]
xfail_strict = true
filterwarnings = ["error"]

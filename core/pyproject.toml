[project]
name = "tri-al"
version = "2.0.0.dev0"
description = "Mirror ClinicalTrials.gov into SQLite and explore it in a fast local dashboard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "backports-zstd>=1.8.0 ; python_full_version < '3.14'",
    "orjson>=3.13.0",
    "pydantic>=2.12",
    "sqlalchemy>=2.1",
    "tomlkit>=0.13",
    "typer>=0.20",
]

[project.optional-dependencies]
testing = ["pytest>=9.1"]

[project.scripts]
tri-al = "tri_al.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

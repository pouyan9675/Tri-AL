name: v2 CI

# Tri-AL v2 (uv workspace in core/ and plugins/). v1's Django CI is deploy.yml.

on:
  push:
    branches: [v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format github

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: CLI smoke test
        run: |
          uv run trial-al plugins list
          uv run trial-al doctor
